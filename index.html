<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive spot-weld spatter simulator: see why spot welds spatter and how to prevent it.">
<title>Spot Spatter Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work explainer for Welding Shop team and management: clear, technical, calm
   IDEA a cutaway macro-section of a spot weld under a weld-timer screen: set the schedule, fire, watch
   PICTURE live cross-section (gold cap tips, 2 or 3 sheets, nugget, corona-bond limits, sparks, zoom lens) + timer chart
   COLOUR white / graphite stage; gold tips, molten orange nugget, containment blue, spatter red
   TYPE IBM Plex Sans Thai 700 + 400
   LAYOUT sticky bar (plant, layers, language, present), title, case tabs, stage + controls, explanation, stack/chisel, overview */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111519);--ink:light-dark(#151a20,#e7ecf0);--mut:light-dark(#56616c,#9ba7b2);--pan:light-dark(#f2f4f6,#1a2027);--line:light-dark(#d9dee3,#2c343c);--gold:light-dark(#9a6f00,#e8b923);--melt:#ff7a1a;--hold:light-dark(#2c7cd0,#5aa9e6);--red:light-dark(#d0261c,#ff5a4a);--ok:light-dark(#1d7f47,#4cc98a);--amb:light-dark(#a86200,#f0a640)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai","Leelawadee UI","Noto Sans Thai",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,44px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
h2{font-size:24px;line-height:1.2;margin:0 0 8px}
h3{font-size:17px;margin:0 0 8px}
.lead{max-width:70ch;margin:0;color:var(--mut)}
.lead b{color:var(--ink)}
button,select,input{font:inherit}
button{font-size:15px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mut)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hold);outline-offset:2px}
[aria-pressed=true].tg{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:8px max(5vw,16px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font-weight:700;margin-right:auto;white-space:nowrap}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.grp button{border:0;border-radius:0;min-width:52px}
.grp button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pri{background:var(--melt);border-color:var(--melt);color:#1b1006;font-weight:700}
.pri:hover{border-color:#c95500}
.plantb{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;max-width:920px}
.rule{background:var(--pan);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.rule i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff}
.rule span{color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px max(5vw,16px) 10px;scroll-padding-inline:max(5vw,16px);max-width:calc(1240px + 10vw);margin:0 auto}
.tabs button{flex:none}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sim{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.stage{background:linear-gradient(#1c2229,#0e1216);border-radius:14px;overflow:hidden;color:#dde5eb;display:flex;flex-direction:column}
.fig{position:relative}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.main .st{flex:none;height:clamp(380px,44vw,560px)}
.st{flex:1}
.ch{height:180px;border-top:1px solid #2a323a;flex:none}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:9px 14px 11px;font-size:13px;color:#b9c4cd;border-top:1px solid #2a323a}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.panel{background:var(--pan);border-radius:14px;padding:18px}
.kind{font-size:14px;color:var(--mut);margin:0 0 10px}
.n3{font-size:14px;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--hold) 12%,transparent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.seg button[data-m=ok]{border-color:var(--ok);color:var(--ok)}
.seg button[data-m=ng]{border-color:var(--red);color:var(--red)}
.seg button[aria-pressed=true][data-m=ok]{background:var(--ok);color:#fff}
.seg button[aria-pressed=true][data-m=ng]{background:var(--red);color:#fff}
.ctl{margin:12px 0}
.ctl label,.ctl .lb{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.ctl output{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.rng{position:relative}
.rng .lim{position:absolute;top:2px;bottom:2px;width:3px;margin-left:-1px;background:var(--red);border-radius:2px;pointer-events:none}
input[type=range]{width:100%;height:32px;accent-color:var(--gold);margin:2px 0 0;position:relative}
.limt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.linkb{background:none;border:0;padding:0 2px;min-height:32px;color:var(--hold);text-decoration:underline;font-size:13px}
.pick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pick button{flex:1;min-width:70px}
.pick button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.play{display:flex;gap:8px;margin:14px 0 8px}
.play .pri{flex:1}
.now{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:1.6em}
.mt{margin:9px 0}
.mh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.mh b{white-space:nowrap;font-variant-numeric:tabular-nums}
.tr{position:relative;height:12px;background:color-mix(in srgb,var(--mut) 22%,transparent);border-radius:6px;margin-top:4px}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.tr em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red)}
.tr em.cb{background:var(--hold);width:3px}
.tr em.lo,.tr em.tg{background:var(--mut);top:0;bottom:0;width:2px;opacity:.8}
.tr em.tg{opacity:.45}
.mkey{font-size:13px;color:var(--mut);margin:2px 0 0}
.verdict{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.verdict.ng{background:color-mix(in srgb,var(--red) 14%,transparent)}
.verdict.amb{background:color-mix(in srgb,var(--amb) 16%,transparent)}
.verdict strong{display:block;font-size:17px}
.verdict.ok strong{color:var(--ok)}.verdict.ng strong{color:var(--red)}.verdict.amb strong{color:var(--amb)}
.try{font-size:14px;margin:12px 0 0;color:var(--mut)}
.keys{font-size:13px;color:var(--mut);margin:8px 0 0}
kbd{font:12px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:var(--bg)}
.ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:16px}
.ex ul,.ex ol{margin:0;padding-left:1.2em}
.ex li{margin-bottom:6px}
.ex section{border-top:3px solid var(--line);padding-top:12px}
.ex section:nth-child(1){border-color:var(--melt)}.ex section:nth-child(2){border-color:var(--hold)}.ex section:nth-child(3){border-color:var(--ok)}
.src{font-size:13px;color:var(--mut);margin:14px 0 0}
.alt{background:var(--pan)}
.chk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:24px;margin-top:14px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mut);font-weight:600}
td select,td input,.dlg select,.dlg input{font-size:16px;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
td input[type=number],.dlg input[type=number]{width:6em}
td input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.ng{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip.c{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.chip.na{background:color-mix(in srgb,var(--mut) 18%,transparent);color:var(--mut)}
.res{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:var(--pan)}
.res b{display:block}
.cond{list-style:none;padding:0;margin:8px 0 0}
.cond li{margin:4px 0}
#ov tr{cursor:pointer}
#ov tr:hover{background:color-mix(in srgb,var(--melt) 8%,transparent)}
.harm{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:14px;margin-top:14px}
.harm div{background:var(--bg);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.note{font-size:13px;color:var(--mut);margin-top:16px;max-width:86ch}
/* dialog */
.dlg{position:fixed;inset:0;z-index:60;background:rgba(8,10,12,.55);display:grid;place-items:center;padding:16px}
.dlg[hidden]{display:none}
.dlg-box{background:var(--bg);color:var(--ink);border-radius:14px;max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row.end{justify-content:flex-end}
.row[hidden]{display:none}
.dlg td{vertical-align:middle}
.msg{min-height:1.5em;font-size:14px;color:var(--ok);margin:4px 0 0}
/* presentation */
.pv{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr);padding:10px max(2vw,12px) 12px}
.pv[hidden]{display:none}
.pv-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-bottom:8px}
.pv-top .n{font-weight:700;font-variant-numeric:tabular-nums}
.pv-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto;justify-content:flex-end}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--melt)}
.pv-main{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px}
.pv-main.full{display:block;overflow:auto}
.pv-head h2{font-size:clamp(22px,2.2vw,32px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;font-size:clamp(15px,1.15vw,18px)}
.facts div{border-top:3px solid var(--line);padding-top:6px}
.facts div:nth-child(1){border-color:var(--melt)}.facts div:nth-child(2){border-color:var(--hold)}.facts div:nth-child(3){border-color:var(--ok)}
.facts b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) auto;column-gap:14px;row-gap:6px;min-height:0}
.pair.one{grid-template-columns:minmax(0,1fr)}
.pcard{display:grid;grid-row:span 3;grid-template-rows:subgrid;min-height:0}
.phd{display:flex;align-items:center;align-self:start;gap:8px;flex-wrap:wrap;font-size:15px}
.phd .chip{font-size:15px;padding:3px 12px}
.pcard .stage{min-height:0}
.pcard .st{min-height:200px}
.pcard .ch{height:104px}
.pcard .verdict{margin:0;font-size:15px;padding:8px 12px}
.mark{flex:none;display:inline-block;vertical-align:middle}
.vh{display:flex;gap:12px;align-items:flex-start}
.why{color:var(--red);font-weight:700;margin:0 0 4px;font-size:15px}
.phd .why{flex-basis:100%;font-size:16px;margin:0}
.phd .why[hidden]{display:none}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pcard .verdict strong{font-size:16px}
.pv-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mut)}
.pv-full{max-width:1100px;margin:0 auto;width:100%;font-size:clamp(17px,1.4vw,20px)}
.pv-full h1{font-size:clamp(32px,4vw,52px)}
.pv-full .two{max-width:none}
@media(max-width:900px){.sim,.chk{grid-template-columns:minmax(0,1fr)}.ex{grid-template-columns:minmax(0,1fr)}.pv-main{display:block;overflow:auto}.pair{grid-template-columns:minmax(0,1fr)}.pcard .st{height:300px;flex:none}.facts{grid-template-columns:minmax(0,1fr)}.pv-ctl{margin-left:0;justify-content:flex-start}}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:13px}.brand{display:none}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
<span class="brand">Spot Spatter Simulator</span>
<button id="plantb" class="plantb"></button>
<div class="grp" role="group" aria-label="Layers"><button data-layers="2"></button><button data-layers="3"></button></div>
<div class="grp" role="group" aria-label="Language"><button data-lang="th">TH</button><button data-lang="en">EN</button></div>
<button class="pri" id="pres" data-t="pres"></button>
</div></div>

<header class="band" style="padding-bottom:14px"><div class="wrap">
<h1 data-t="h1"></h1>
<p class="lead" data-h="lead"></p>
<div class="two">
<div class="rule"><i style="background:var(--melt)">1</i><div><b data-t="m1"></b><br><span data-t="m1d"></span></div></div>
<div class="rule"><i style="background:var(--red)">2</i><div><b data-t="m2"></b><br><span data-t="m2d"></span></div></div>
</div>
</div></header>

<nav class="tabs" id="tabs"></nav>

<main class="band" style="padding-top:8px"><div class="wrap sim">
<div class="stage main" id="stage">
<div class="fig st"><svg class="svs" role="img"></svg></div>
<div class="leg"><span><i class="sw" style="background:#ff8a1f"></i><span data-t="lgN"></span></span><span><i class="sw" style="background:#5aa9e6"></i><span data-t="lgB"></span></span><span><i class="sw" style="background:#ffd25a"></i>Spatter</span><span><i class="sw" style="background:#e8b923"></i><span data-t="lgT"></span></span></div>
<div class="fig ch"><svg class="cvs" role="img"></svg></div>
<div class="leg"><span><i class="sw" style="background:#ff8a1f"></i><span data-t="lgI"></span></span><span><i class="sw" style="background:#5aa9e6;height:3px"></i><span data-t="lgF"></span></span><span><i class="sw" style="background:#ff5a4a;width:3px"></i><span data-t="lgS"></span></span><span>1 cyc = 20 ms (50 Hz)</span></div>
</div>
<aside class="panel">
<h2 id="ct"></h2>
<p class="kind" id="ck"></p>
<p style="margin:0" id="cl"></p>
<p class="n3" id="n3" hidden></p>
<div class="seg"><button data-m="ok" id="bok"></button><button data-m="ng" id="bng"></button></div>
<div id="ctl"></div>
<div class="play"><button class="pri" id="bp"></button><button id="bs" aria-pressed="false" class="tg"></button></div>
<div class="now" id="now"></div>
<div id="mets"></div>
<div class="verdict" id="vd"></div>
<p class="try" id="tryit"></p>
<p class="keys" data-h="keys"></p>
</aside>
</div></main>

<section class="band" style="padding-top:0"><div class="wrap">
<h2 id="xt"></h2>
<div class="ex">
<section><h3 data-t="xm"></h3><ol id="xm"></ol></section>
<section><h3 data-t="xs"></h3><ul id="xs"></ul></section>
<section><h3 data-t="xc"></h3><ul id="xc"></ul></section>
</div>
<p class="src" id="xsrc" hidden></p>
</div></section>



<section class="band"><div class="wrap">
<h2 id="ovh"></h2>
<p class="kind" style="margin:0" data-t="ovd"></p>
<div class="scroll"><table class="stack" style="margin-top:12px"><thead><tr><th data-t="ovc1"></th><th data-t="ovc2"></th><th data-t="ovc3"></th><th data-t="ovc4"></th></tr></thead><tbody id="ov"></tbody></table></div>
<h2 style="margin-top:30px" data-t="hh"></h2>
<div class="harm"><div><h3 data-t="h1t"></h3><span data-t="h1d"></span></div><div><h3 data-t="h2t"></h3><span data-t="h2d"></span></div><div><h3 data-t="h3t"></h3><span data-t="h3d"></span></div><div><h3 data-t="h4t"></h3><span data-t="h4d"></span></div></div>
<p class="note" data-t="note"></p>
</div></section>

<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgt"><div class="dlg-box">
<h2 id="dlgt" data-t="dlgT"></h2>
<p class="kind" data-t="dlgD"></p>
<div class="row"><label for="plsel"><b>Plant</b></label><select id="plsel"></select><button id="pladd" data-t="add"></button><button id="pldel" data-t="del"></button></div>
<div class="row" id="newpl" hidden><input id="plname" maxlength="40" aria-label="Plant name"><button id="plok" class="pri" data-t="create"></button><button id="plno" data-t="cancel"></button></div>
<div class="scroll"><table><thead><tr><th data-t="dF"></th><th data-t="dR"></th><th data-t="dV"></th><th data-t="dD"></th></tr></thead><tbody id="dlrows"></tbody></table></div>
<div class="row"><b data-t="dView"></b><div class="grp" role="group"><button data-dview="pair"></button><button data-dview="seq"></button></div></div>
<p class="msg" id="dlmsg" aria-live="polite"></p>
<div class="row end"><button id="dldef" data-t="toDef"></button><button id="dlno" data-t="close"></button><button id="dlsave" class="pri" data-t="save"></button></div>
</div></div>

<div class="pv" id="pv" hidden>
<div class="pv-top"><span class="n" id="pvn"></span><div class="dots" id="pvd"></div>
<div class="pv-ctl">
<button id="pvp" data-t="prev"></button><button id="pvnx" class="pri" data-t="next"></button>
<button id="pvauto" class="tg" aria-pressed="false"></button><button id="pvloop" class="tg" aria-pressed="false"></button><button id="pvr" data-t="replay"></button>
<div class="grp" role="group"><button data-view="pair"></button><button data-view="seq"></button></div>
<div class="grp" role="group"><button data-layers="2"></button><button data-layers="3"></button></div>
<div class="grp" role="group"><button data-lang="th">TH</button><button data-lang="en">EN</button></div>
<button id="pvx" data-t="exit"></button>
</div></div>
<div class="pv-main" id="pvm"></div>
</div>

<script>
/* Spot weld spatter model — simplified, for teaching trends only */
const M=(()=>{
const RT=3,RD=8,IMIN=5.5,INOM=9,E0B=(INOM*INOM-IMIN*IMIN)*12,TC=8,TO=6,JC=1.7,SC=2.0,PEXP=0.62,IREFP=0.21,LIFT=4,KZ=0.45;
const DEF={
 2:{pl:[{t:0.8,s:0,ga:true},{t:0.8,s:0,ga:false}],I:9,W:12,U:0,S:25,H:10,F:2.5,Fok:2.5},

th:{n:'ผิวสกปรก',t:'ผิวสกปรก / มีสารคั่น',ty:'Surface spatter (表チリ) ที่ผิว tip',mk:'ความต้านทานผิวสูง ร้อนที่ผิวนอก',chk:'Sealer / น้ำมันไม่เลอะจุด spot, tip dress ตามรอบ',l:'คราบที่ผิวทำให้ความต้านทานผิวสูง ความร้อนไปเกิดที่ผิว tip–แผ่น แทนที่จะเกิดที่รอยต่อ',
m:['น้ำมัน สนิม sealer หรือคราบ Zn บนหน้า tip เพิ่มความต้านทานที่ผิวสัมผัส electrode–แผ่น','ความร้อนเกิดที่ผิวนอกมากขึ้น ผิวหลอมและกระเด็นออกรอบหน้า tip','tip ติดชิ้นงาน หน้า tip เสื่อมเร็ว รอบต่อไปยิ่งแย่ลง'],
s:['ประกายไฟออกรอบหน้า tip ด้านนอก ไม่ใช่ระหว่างแผ่น','ผิวรอย spot ไหม้ดำ มีรอยแตกหรือหลุมที่ผิว','tip ติดชิ้นงาน ต้องดึงออก'],
c:['ควบคุมไม่ให้ sealer หรือน้ำมันเลอะบริเวณจุด spot','แต่ง tip ตามรอบให้หน้า tip สะอาด','ตรวจสภาพชิ้นงาน (สนิม คราบ) ก่อนเข้าสถานี'],y:'เพิ่มความสกปรก: ประกายไฟออกจากหน้า tip ด้านบน และแถบความร้อนผิวเกินเส้นแดง'},
en:{n:'Dirty surface',t:'Contaminated surface / foreign layer',ty:'Surface spatter (表チリ) at the tip',mk:'High surface resistance, heat at the outer surface',chk:'No sealer/oil at spots; tip dressing on schedule',l:'Contamination raises surface resistance, so heat forms at the tip–sheet surface instead of the interface.',
m:['Oil, rust, sealer or Zn pick-up on the tip face raise resistance at the electrode–sheet contact.','More heat forms at the outer surface, which melts and splashes around the tip face.','Tips stick to the part and wear faster, making the next welds worse.'],
s:['Sparks around the outside of the tip face, not between sheets','Blackened spot surface with cracks or pits','Tips stick to the part and must be pulled off'],
c:['Keep sealer and oil away from spot positions','Dress tips on schedule to keep faces clean','Check parts for rust and residue before the station'],y:'Raise contamination: sparks leave from the upper tip face and the surface-heat bar crosses the red line.'}},
{id:'overlap',k:['ovp','ov'],ok:(b,n)=>({ov:11,ovp:n===2?0:1}),ng:(b,n)=>({ov:2.5,ovp:n===2?0:1}),
th:{n:'ชิ้นงานซ้อนไม่เต็ม',t:'ชิ้นงานซ้อนกันไม่เต็ม (Part overlap ไม่พอ)',ty:'ออกทางปลายชิ้นที่สั้น และที่ผิว',mk:'หน้า tip ส่วนที่เลยปลายชิ้นไม่มีอะไรรองรับ',chk:'ตำแหน่งชิ้นงานใน jig, ขนาดชิ้นงาน, ตำแหน่ง spot',l:'ปลายของชิ้นงานชิ้นหนึ่งมาสิ้นสุดใต้หน้า tip ฝั่งที่ซ้อนครบรับแรงกดทั้งหมด ฝั่งที่ขาดชั้นกลายเป็นขั้นหรือช่องว่าง',
m:['ส่วนของหน้า tip ที่อยู่เลยปลายชิ้นที่สั้นไม่มีอะไรรองรับ (เป็นขั้นบันไดหรือช่องว่าง) แรงกดและกระแสจึงลงเฉพาะฝั่งที่ซ้อนครบ','พื้นที่สัมผัสเล็กลงและเยื้องข้าง ร้อนกระจุกเหมือนแรงกดไม่พอ','รอยต่อที่ติดกับชิ้นที่สั้นสิ้นสุดที่ปลายชิ้น Nugget ที่โตถึงตรงนั้นจึงทะลักออก ใน 3 ชั้นถ้าชิ้นกลางสั้น แผ่นนอกเลยปลายชิ้นจะลอยเป็นช่องว่างเท่าความหนาชิ้นกลาง'],
s:['Spatter ออกทางปลายชิ้นงานที่สั้น','รอย tip ครึ่งวงหรือเป็นขั้นบนผิว','มักเกิดจากชิ้นงานเลื่อนใน jig, ชิ้นงานขนาดผิด (ตัดสั้น), ตำแหน่ง spot ไม่ตรง'],
c:['ตรวจตำแหน่งชิ้นงานใน jig (locate pin, clamp) ให้ระยะซ้อนตาม drawing','ยืนยันขนาดชิ้นงานและ flange จากผู้ผลิตชิ้นงาน','ใช้ gauge ตรวจตำแหน่ง spot เทียบกับปลายชิ้นงาน'],y:'เลือกชิ้นที่สั้น แล้วลดระยะซ้อน ดูหน้า tip ส่วนที่เลยปลายชิ้นไม่มีอะไรรองรับ'},
en:{n:'Partial overlap',t:'Parts overlap only partly at the spot',ty:'Out through the short part’s end; surface',mk:'Tip face beyond the short part’s end is unsupported',chk:'Part position in jig, part size, spot position',l:'One part ends under the tip face. The fully stacked side takes all the force; the other side becomes a step or a void.',
m:['The part of the tip face beyond the short part’s end has nothing under it (a step or a void), so force and current go only through the fully stacked side.','Contact shrinks and shifts sideways, concentrating heat like low force.','The interface touching the short part ends at its end; a nugget that reaches it bursts out. With 3 layers, if the middle part is short, the outer sheets float over a void as thick as the middle sheet.'],
s:['Spatter out of the short part’s end','Half-moon or stepped tip marks','Usually parts shifted in the jig, wrong part size (short-cut), or mispositioned spots'],
c:['Check part position in the jig (locate pins, clamps) for the drawing overlap','Confirm part and flange dimensions with the supplier','Gauge the spot position against the part end'],y:'Choose the short part, reduce the overlap, and watch the tip face beyond the end lose its support.'}},
{id:'force',k:['F'],ok:()=>({}),ng:b=>({F:r2(b.F*0.56)}),zoom:'seam',
th:{n:'แรงกดไม่พอ',t:'แรงกด Electrode ไม่พอ',ty:'Initial และระหว่างแผ่น',mk:'แผ่นแนบกันไม่สนิท พื้นที่สัมผัสเล็ก ขอบเขตกดยึดแคบ',chk:'Force gauge, แรงดันลม, regulator, cylinder รั่ว',l:'แรงกดน้อย ผิวแผ่นแนบกันไม่สนิท (ดูเลนส์ซูม) จุดสัมผัสจริงเหลือน้อย กระแสกระจุก ร้อนเร็ว แต่วงแหวนกดยึดกลับเล็กลง',
m:['ผิวเหล็กไม่เรียบสนิท ต้องใช้แรงกดบีบผิวให้แนบกัน แรงน้อยจุดสัมผัสจริงจึงเหลือแค่บางจุด และแผ่นยังเผยอรอบจุด spot','กระแสเท่าเดิมไหลผ่านจุดสัมผัสที่เล็กลง ความหนาแน่นกระแสสูง ร้อนเร็วกว่าปกติ','วงแหวนกดยึด (Corona bond) เล็กลงด้วย จึงกั้นโลหะหลอมไม่อยู่ เสียทั้งสองทาง'],
s:['Spatter มากขึ้นแม้ใช้ schedule เดิม','รอย tip ตื้นและเล็ก เห็นแผ่นเผยอรอบจุด','มักพบเมื่อแรงดันลมตก regulator เพี้ยน cylinder หรือซีลรั่ว gun ฝืด'],
c:['วัดแรงกดด้วย Force gauge ตามรอบ และทุกครั้งหลังซ่อม gun','ตรวจแรงดันลมเข้า gun และ regulator ทุกกะ','ตรวจการรั่วของ cylinder และการเคลื่อนที่ของ arm'],y:'ดูเลนส์ซูมมุมขวา: แรงกดปกติผิวแนบเกือบทั้งหมด แรงกดต่ำเหลือจุดสัมผัสไม่กี่จุดที่ร้อนแดงเมื่อกระแสมา'},
en:{n:'Low force',t:'Electrode force too low',ty:'Initial and between sheets',mk:'Sheets not fully seated, small contact, narrow clamped zone',chk:'Force gauge, air pressure, regulator, cylinder leaks',l:'With low force the sheet surfaces do not seat fully (see the zoom lens). Real contact is only a few points, so current crowds, heats fast, and the clamped ring shrinks.',
m:['Steel surfaces are never perfectly flat; force is what squeezes them together. With low force only a few points really touch and the sheets stay slightly open around the spot.','The same current passes through less real contact, so current density and heating rise.','The corona bond ring is also smaller, so it cannot hold the melt: a loss on both sides.'],
s:['More spatter on the same schedule','Shallow, small tip marks; sheets visibly open around the spot','Often from low air pressure, a drifting regulator, leaking cylinder or seals, a sticky gun'],
c:['Measure force with a force gauge on schedule and after every gun repair','Check gun air pressure and regulator every shift','Check cylinder leaks and arm movement'],y:'Watch the zoom lens: at normal force the surfaces seat almost fully; at low force only a few contact points remain and they glow when current arrives.'}},
{id:'init',k:['S','U'],ok:()=>({U:3}),ng:()=>({S:10}),zoom:'seam',
th:{n:'Short squeeze time',t:'Short squeeze time: ปล่อยกระแสก่อนกดสนิท / ไม่มี Upslope',ty:'Initial spatter (初期チリ) ทันทีที่เริ่ม',mk:'กระแสเต็มเข้าตอนผิวยังแตะกันเป็นจุดเล็ก',chk:'Squeeze time, Upslope, วิธียิงของ operator',l:'Gun ต้องใช้เวลาปิดและเพิ่มแรงกด ถ้ากระแสเต็มเข้าก่อน จุดสัมผัสเล็กๆ จะหลอมและระเบิดออก',
m:['Squeeze time ต้องครอบคลุมทั้งเวลาที่ gun ปิดลงมา (ในแบบจำลอง 8 cyc) และเวลาที่แรงกดไต่ขึ้นถึงค่าตั้ง','ถ้ากระแสมาก่อนแรงกดเต็ม ผิวยังแตะกันเป็นจุดเล็ก ความหนาแน่นกระแสสูงมาก หลอมทันทีโดยยังไม่มีวงแหวนกั้น','Upslope คือค่อยๆ เพิ่มกระแส ให้ผิวนิ่มและพื้นที่สัมผัสขยายก่อนกระแสเต็ม (แนวคิดของ New Timer สำหรับ Spatterless)'],
s:['ประกายไฟออกทันทีที่กดสวิตช์ (cycle แรกๆ)','พบบ่อยกับ portable gun เมื่อยิงเร็ว หรือ gun ยังขยับตอนเริ่มเชื่อม','ผิวกลางรอยไหม้ มีหลุมเล็ก'],
c:['ตั้ง Squeeze time ให้แรงกดถึงค่าตั้งก่อนปล่อยกระแส','ใช้ Upslope ตาม workflow การใช้ upslope ลด spatter','วาง gun ให้นิ่ง กดให้สนิทแล้วจึงยิง ไม่ขยับระหว่างเชื่อม'],y:'ดูกราฟ: แรงกด (ฟ้า) ยังไต่ไม่ถึงแต่กระแส (ส้ม) มาแล้ว ลองเพิ่ม Squeeze หรือใส่ Upslope 3 cyc'},
en:{n:'Short squeeze time',t:'Short squeeze time: current before full force / no upslope',ty:'Initial spatter (初期チリ) right at the start',mk:'Full current while surfaces touch at small points',chk:'Squeeze time, upslope, operator firing habit',l:'The gun needs time to close and build force. If full current arrives first, the small contact points melt and burst.',
m:['Squeeze time must cover both the gun closing stroke (8 cyc in this model) and the force rising to its set value.','If current comes before full force, surfaces touch only at small points; current density is extreme and they melt with no ring to contain them.','Upslope ramps current up so the surface softens and contact spreads before full current (the New Timer concept for spatter-less).'],
s:['Sparks the instant the switch is pressed (first cycles)','Common with portable guns fired quickly or still moving at weld start','Burnt centre with small pits'],
c:['Set squeeze time so force reaches its set value before current','Use upslope per the upslope spatter-reduction workflow','Hold the gun still, seat it, then fire; do not move during the weld'],y:'Look at the chart: force (blue) has not finished rising when current (orange) arrives. Add squeeze or 3 cyc of upslope.'}},
{id:'heat',k:['I','W'],ok:()=>({}),ng:b=>({I:r1(b.I+3.5),W:b.W+4}),
th:{n:'กระแส/เวลาเกิน',t:'กระแสหรือเวลาเชื่อมมากเกินไป',ty:'ระหว่างแผ่น (中チリ) ช่วงกลาง–ท้ายการเชื่อม',mk:'Nugget ใหญ่เกินขอบเขตกดยึด',chk:'Weld schedule ถูกต้อง, ไม่เพิ่มกระแสเผื่อ',l:'ความร้อน Q = I²·R·t ยิ่งกระแสสูงหรือเวลานาน Nugget ยิ่งโต จนล้นขอบเขตที่ tip กดยึดไว้',
m:['ความร้อนเกิดมากที่สุดที่รอยต่อระหว่างแผ่น (ความต้านทานสูงสุด) จึงหลอมเป็น Nugget ตรงนั้นก่อน','รอบ Nugget มีวงแหวนเหล็กที่ยังไม่หลอมแต่ถูกกดแน่น (Corona bond) ทำหน้าที่เหมือนซีลกั้นโลหะหลอม','ถ้าความร้อนเกิน Nugget โตเกินวงแหวนนี้ โลหะหลอมที่ขยายตัวดันแผ่นแยกและพุ่งออกทางรอยต่อ'],
s:['เสียงดังกลาง–ท้ายจังหวะเชื่อม ตามด้วยประกายไฟพุ่งออกด้านข้าง','มีครีบโลหะ (fin) ยื่นออกระหว่างแผ่น และเม็ด spatter ติดรอบจุด','รอย tip กดลึก แผ่นยุบมากผิดปกติ'],
c:['ใช้ Weld schedule ตาม standard ของจุดนั้น (เลข schedule ตรงกับ gun และชิ้นงาน)','ห้ามเพิ่มกระแสเผื่อเพื่อให้ chisel ผ่าน ให้หาสาเหตุที่ Nugget เล็กก่อน (tip สึก แรงกด gap)','ตั้ง Stepper ให้เพิ่มกระแสตามการสึกของ tip อย่างพอดี'],y:'กด NG แล้วเล่น: Nugget สีส้มโตจนชนเส้นฟ้าแล้วพุ่งออก ลองลดกระแสทีละ 0.5 kA เพื่อหาจุดที่เริ่มเกิด'},
en:{n:'Too much current/time',t:'Weld current or time too high',ty:'Between sheets (中チリ), mid to late weld',mk:'Nugget larger than the clamped zone',chk:'Correct weld schedule; no “extra” current',l:'Heat Q = I²·R·t. More current or time grows the nugget until it overflows the zone the tips clamp.',
m:['Heat is highest at the sheet interface (highest resistance), so the nugget melts there first.','Around the nugget is a ring of unmelted, tightly pressed steel (corona bond) that seals the molten metal in.','With too much heat the nugget outgrows that ring; the expanding melt forces the sheets apart and escapes along the interface.'],
s:['A bang mid to late in the weld, then sparks flying sideways','A metal fin between the sheets and spatter beads around the spot','Deep tip marks, excessive indentation'],
c:['Use the standard weld schedule for that spot (schedule number matches gun and part)','Never add current “to pass the chisel”; first find why the nugget is small (tip wear, force, gap)','Set the stepper to raise current in line with tip wear'],y:'Press NG and play: the orange nugget grows into the blue line and bursts. Lower current in 0.5 kA steps to find the onset.'}},
{id:'dia',k:['tipd','fw'],lim:'edge',ok:()=>({tipd:13,fw:14.5}),ng:()=>({tipd:16,fw:14.5}),
th:{n:'Tip Ø16→13',t:'ใช้ tip Ø13 กับชิ้นงานที่มี joggle หรือ flange สั้น',ty:'ทะลุออกทางขอบ flange',mk:'tip Ø16 ชนผนังชิ้นงาน จุดเชื่อมถูกดันไปชิดขอบ',chk:'tip Ø13 ที่ door opening / flange สั้น, ศูนย์ tip ถึงขอบ ≥ 5 mm',l:'ชิ้นงานที่มีผนังตั้ง (joggle) ติดกับ flange สั้น ตัว tip Ø16 ชนผนังก่อน จุดเชื่อมจึงถูกดันออกไปชิดขอบ flange เปลี่ยนเป็น tip Ø13 ที่เพรียวกว่าจะวางจุดเชื่อมลึกเข้าไปได้ ให้ศูนย์ tip ห่างขอบ flange ≥ 5 mm',
m:['ศูนย์ tip ต้องห่างผนังอย่างน้อยเท่ารัศมีตัว tip บวกระยะเผื่อรัศมีดัด (ในแบบจำลอง 2.5 mm)','tip Ø16 (รัศมี 8 mm) วางจุดเชื่อมชิดผนังได้น้อยกว่า tip Ø13 (รัศมี 6.5 mm) อยู่ 1.5 mm จุดเชื่อมจึงถูกดันไปทางขอบ','ถ้าระยะศูนย์ tip ถึงขอบต่ำกว่าค่าแบ่งของ Plant (Default 5 mm) ฝั่งขอบไม่มีเนื้อเหล็กล้อมกั้น Nugget ทะลักออกทางขอบ เหมือนหัวข้อ Spot ชิดขอบ'],
s:['Spatter ที่ขอบ flange บริเวณ door opening หรือจุดที่มีผนังตั้งใกล้ๆ','ตำแหน่งจุดเชื่อมไม่คงที่ บางจุดชิดขอบ','ตัว tip มีรอยเสียดสีกับผนังชิ้นงาน'],
c:['ใช้ tip Ø13 (slim) ที่ door opening และจุดที่ flange สั้น','ใช้เฉพาะกระบวนการที่มี Tip former และเครื่องมือที่รวมกับใบมีดหลักแล้ว','ตรวจระยะศูนย์ tip ถึงขอบ flange ≥ 5 mm ด้วย gauge'],y:'สลับ Ø16 กับ Ø13 แล้วดูระยะศูนย์ tip ถึงขอบ flange เทียบเส้นเกณฑ์'},
en:{n:'Tip Ø16→13',t:'Use a Ø13 tip on joggles and short flanges',ty:'Out through the flange edge',mk:'A Ø16 tip hits the part wall, pushing the spot toward the edge',chk:'Ø13 tip at door openings / short flanges; tip centre to edge ≥ 5 mm',l:'Where a wall (joggle) rises next to a short flange, a Ø16 tip hits the wall first, so the weld point is pushed toward the flange edge. A slimmer Ø13 tip places the spot further in, keeping the tip centre ≥ 5 mm from the edge.',
m:['The tip centre must stay at least one tip radius plus the bend clearance (2.5 mm in this model) from the wall.','A Ø16 tip (radius 8 mm) gets 1.5 mm less room than a Ø13 tip (radius 6.5 mm), so the spot moves toward the edge.','Below the plant edge limit (default 5 mm) there is no steel on the edge side to contain the nugget, and it bursts out of the edge, as in Spot near edge.'],
s:['Spatter at the flange edge around door openings or near walls','Spot positions vary; some sit close to the edge','Rub marks from the part wall on the tip'],
c:['Use slim Ø13 tips at door openings and short flanges','Only where a tip former and a tool integrated with the main blade have been introduced','Gauge tip centre to flange edge ≥ 5 mm'],y:'Switch between Ø16 and Ø13 and compare tip centre to edge distance with the limit line.'}},
{id:'lab',k:['I','W','S','U','F','ang','off','gap','edge','cont','dmg'],ok:()=>({edge:10}),ng:(b,n,L)=>({I:r1(b.I+0.5),F:r2(b.F*0.88),ang:rs(L.ang*0.7,0.5),gap:rs(L.gap*0.6,0.05),off:rs(L.off*0.6,0.05),edge:10}),zoom:'seam',
th:{n:'ทดลองรวม',t:'โหมดทดลอง: ปรับทุกตัวแปรพร้อมกัน',ty:'แล้วแต่สาเหตุที่ซ้อนกัน',mk:'',chk:'',l:'หน้างานจริงมักมีหลายสาเหตุซ้อนกัน แต่ละตัวยังอยู่ในเกณฑ์ OK แต่รวมกันแล้วข้ามเส้น',

/* ---------- stack & chisel ---------- */
function stackUI(){if(!$('stk'))return;const pl=STK[layers],nm=PNN();
 $('stk').innerHTML=pl.map((x,i)=>`<tr><td><b>${nm[i]}</b></td><td><input type="number" id="pt${i}" data-i="${i}" data-f="t" min="0.5" max="3" step="0.05" value="${x.t}"></td><td><select id="ps${i}" data-i="${i}" data-f="s">${SCL.map((s,j)=>`<option value="${j}"${j===x.s?' selected':''}>${s}</option>`).join('')}</select></td><td>${i===0?`<input type="checkbox" id="pga" data-i="${i}" data-f="ga"${x.ga?' checked':''}>`:'<span class="chip na">—</span>'}</td></tr>`).join('');}
function chisel(){const R=main.R;if(!R||!$('ckb'))return;const c=M.chisel(R.p),ifn=IFN(),RN=['','I','II','III','IV'];
 const cell=r=>({1:['ok','na','ok'],2:['c','ok','ok'],3:['ng','c','ok'],4:['ng','ng','ok']}[r]);
 const chip=v=>v==='ok'?`<span class="chip ok">${T('cOK')}</span>`:v==='c'?`<span class="chip c">${T('cC')}</span>`:v==='ng'?`<span class="chip ng">${T('cNG')}</span>`:`<span class="chip na">${T('cNA')}</span>`;
 $('ckb').innerHTML=c.res.map(x=>{const d=R.fin.d[x.i],cr=R.crit[x.i],st=d<cr.lo?'ng':d<cr.tg?'c':'ok',cl=cell(x.r);
  return `<tr><td data-l="${T('thI')}"><b>${ifn[x.i]}</b></td><td data-l="${T('thN')}">${d.toFixed(1)} mm ${chip(st)}</td><td data-l="${T('thR')}">${RN[x.r]} <span class="kind">(${SCL[x.pair[0]]} × ${SCL[x.pair[1]]})</span></td><td data-l="${T('thSC')}">${chip(cl[0])}</td><td data-l="${T('thST')}">${chip(cl[1])}</td><td data-l="${T('thUT')}">${chip(cl[2])}</td></tr>`;}).join('');
 if(c.thin){const t=c.thin,ck=v=>v?'✓':'✗';
  $('thin').innerHTML=`<div class="res"><b>${T('thinT')}</b><ul class="cond"><li>${ck(t.ga)} ${T('cGA')}</li><li>${ck(t.s270)} ${T('c270')}</li><li>${ck(t.tOk)} ${T('cT')}</li></ul><p style="margin:8px 0 0"><span class="chip ${t.ok?'ok':'ng'}">${t.ok?T('thinOK'):T('thinNG')}</span></p><p class="kind" style="margin:8px 0 0">${T('rule5')}</p></div>`;}
 else $('thin').innerHTML='';}

/* ---------- plant conditions dialog ---------- */
const DL={sel:null,vals:null,view:pvView,delArm:false};
function dlgOpen(){DL.sel=plant;DL.vals={...LIM()};DL.view=pvView;DL.delArm=false;$('newpl').hidden=true;$('dlmsg').textContent='';dlgRender();$('dlg').hidden=false;$('plsel').focus();}
function dlgClose(){$('dlg').hidden=true;}
function dlgRender(){const sel=$('plsel');sel.textContent='';const o0=document.createElement('option');o0.value='';o0.textContent=T('defPlant');sel.appendChild(o0);
 Object.keys(plants).forEach(nm=>{const o=document.createElement('option');o.value=nm;o.textContent=nm;sel.appendChild(o);});sel.value=DL.sel||'';
 const ro=!DL.sel;$('pldel').disabled=ro;$('pldel').textContent=DL.delArm?T('delQ'):T('del');
 $('dlrows').innerHTML=Object.keys(LIMDEF).map(f=>{const q=LIMF[f];return `<tr><td>${LIMN[f][lang]}</td><td>${q.lo?'≥':'≤'}</td><td><input type="number" id="lv-${f}" data-f="${f}" min="${q.mn}" max="${q.mx}" step="${q.st}" value="${DL.vals[f]}"${ro?' disabled':''}> ${PR[f].u}</td><td>${LIMDEF[f]} ${PR[f].u}</td></tr>`;}).join('');
 document.querySelectorAll('[data-dview]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.dview===DL.view);b.textContent=b.dataset.dview==='pair'?T('vPair'):T('vSeq');});
 if(ro)$('dlmsg').textContent=T('dfNote');}
function dlgRead(){const v={};for(const f of Object.keys(LIMDEF)){const q=LIMF[f],x=+$('lv-'+f).value;if(!(x>=q.mn&&x<=q.mx)){$('dlmsg').textContent=`${LIMN[f][lang]}: ${T('badV')} ${q.mn}–${q.mx}`;return null;}v[f]=x;}return v;}
$('plantb').addEventListener('click',dlgOpen);
$('dlrows').addEventListener('input',e=>{const f=e.target.dataset.f;if(f)DL.vals[f]=+e.target.value;});
$('plsel').addEventListener('change',e=>{DL.sel=e.target.value||null;DL.vals={...(DL.sel?plants[DL.sel]:LIMDEF)};DL.delArm=false;$('dlmsg').textContent='';dlgRender();});
$('pladd').addEventListener('click',()=>{$('newpl').hidden=false;$('plname').value='';$('plname').focus();});
$('plno').addEventListener('click',()=>{$('newpl').hidden=true;});
$('plok').addEventListener('click',()=>{const nm=$('plname').value.trim();if(!nm){$('dlmsg').textContent=T('nameNeed');return;}if(plants[nm]){$('dlmsg').textContent=T('nameDup');return;}
 const v=DL.sel?dlgRead():{...LIMDEF};if(!v)return;plants[nm]=v;DL.sel=nm;DL.vals={...v};savePlants();$('newpl').hidden=true;$('dlmsg').textContent='';dlgRender();});
$('pldel').addEventListener('click',()=>{if(!DL.sel)return;if(!DL.delArm){DL.delArm=true;dlgRender();return;}delete plants[DL.sel];if(plant===DL.sel)plant=null;DL.sel=null;DL.vals={...LIMDEF};DL.delArm=false;savePlants();dlgRender();afterLimitChange();});
$('dldef').addEventListener('click',()=>{DL.vals={...LIMDEF};DL.view='pair';dlgRender();});
$('dlno').addEventListener('click',dlgClose);
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')dlgClose();const b=e.target.closest('[data-dview]');if(b){DL.view=b.dataset.dview;dlgRender();}});
$('dlsave').addEventListener('click',()=>{if(DL.sel){const v=dlgRead();if(!v)return;plants[DL.sel]=v;}plant=DL.sel;pvView=DL.view;savePlants();save();$('dlmsg').textContent=T('saved');afterLimitChange();setTimeout(dlgClose,500);});

/* ---------- presentation ---------- */
const PV={on:false,i:0,tok:0,auto:false,loop:false,st:[],timers:[]};
const slides=()=>[{k:'intro'},...TOPICS.map(c=>({k:'case',c})),{k:'sum'}];
function pvButtons(){$('pvauto').textContent=PV.auto?T('autoOn'):T('auto');$('pvauto').setAttribute('aria-pressed',PV.auto);$('pvloop').textContent=T('loop');$('pvloop').setAttribute('aria-pressed',PV.loop);
 document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===pvView));}
function pvLater(tok,ms,f){const h=setTimeout(()=>{if(tok===PV.tok&&PV.on)f();},ms);PV.timers.push(h);}
function pvClear(){PV.timers.forEach(clearTimeout);PV.timers=[];PV.st.forEach(s=>s.dispose());PV.st=[];}
function pvOpen(){main.stop();PV.on=true;PV.i=0;$('pv').hidden=false;document.body.style.overflow='hidden';try{document.documentElement.requestFullscreen?.().catch(()=>{});}catch(e){}pvShow();}
function pvClose(){PV.on=false;PV.tok++;PV.auto=false;PV.loop=false;pvClear();$('pv').hidden=true;document.body.style.overflow='';try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}catch(e){}pvButtons();setCase(C.indexOf(cur),true);}
function paramLine(c,p){return c.k.map(k=>k==='ovp'?`${PR.ovp[lang]}: ${PNN()[p.ovp]}`:k==='tipd'?`Ø${p.tipd}`:`${PR[k][lang]} ${fmt(k,p[k])}`).concat(c.id==='dia'?[`${T('edgeD')} ${p.edge.toFixed(1)} mm`]:[]).join(' · ');}
function pvShow(){const sl=slides(),s=sl[PV.i],tok=++PV.tok;pvClear();pvButtons();
 $('pvn').textContent=`${PV.i+1} / ${sl.length}`;$('pvd').innerHTML=sl.map((_,i)=>`<i class="${i===PV.i?'on':''}"></i>`).join('');
 $('pvp').disabled=PV.i===0;$('pvnx').disabled=PV.i===sl.length-1;$('pvr').hidden=s.k!=='case';
 const m=$('pvm');
 if(s.k!=='case'){m.className='pv-main full';
  if(s.k==='intro')m.innerHTML=`<div class="pv-full"><h1>${T('h1')}</h1><p class="lead">${T('lead')}</p><div class="two"><div class="rule"><i style="background:var(--melt)">1</i><div><b>${T('m1')}</b><br><span>${T('m1d')}</span></div></div><div class="rule"><i style="background:var(--red)">2</i><div><b>${T('m2')}</b><br><span>${T('m2d')}</span></div></div></div><h3 style="margin-top:22px">${T('pvIntro')(TOPICS.length)}</h3><div class="pick">${TOPICS.map(c=>`<span class="chip na" style="font-size:15px;padding:6px 12px">${numOf(c)}${L(c).n}</span>`).join('')}</div><p class="kind" style="margin-top:16px">${T('plant')}: ${esc(plantName())}</p></div>`;
  else m.innerHTML=`<div class="pv-full"><h1 style="font-size:clamp(28px,3vw,40px)">${T('pvSum')}</h1><div class="scroll"><table><thead><tr><th>${T('ovc1')}</th><th>${T('ovc2')}</th><th>${T('ovc4')}</th></tr></thead><tbody>${TOPICS.map(c=>`<tr><td><b>${numOf(c)}${L(c).n}</b></td><td>${L(c).mk}</td><td>${L(c).chk}</td></tr>`).join('')}</tbody></table></div><p class="lead" style="margin-top:14px"><b>${T('hh')}:</b> ${T('h1d')} ${T('h3d')}</p></div>`;
  if(PV.auto){if(s.k==='sum'){PV.auto=false;pvButtons();}else pvLater(tok,7000,()=>pvGo(1));}
  return;}
 const c=s.c,lc=L(c);cur=c;m.className='pv-main';
 const pair=pvView==='pair';
 const card=m2=>`<div class="pcard" data-m="${m2}"><div class="phd"><span class="mk">${MARK(m2==='ok',44)}</span><span class="chip ${m2==='ok'?'ok':'ng'}">${m2==='ok'?T('ok'):T('ng')}</span><span class="pl"></span><p class="why"></p></div><div class="stage">${stageHTML()}</div><div class="verdict"></div></div>`;
 m.innerHTML=`<div class="pv-head"><h2>${numOf(c)}${lc.t}</h2><div class="facts"><div><b>${T('pvC')}</b>${lc.l}</div><div><b>${T('pvE')}</b>${lc.mk}</div><div><b>${T('pvP')}</b>${lc.chk}</div></div></div><div class="pair${pair?'':' one'}">${pair?card('ok')+card('ng'):card('ng')}</div><div class="pv-leg"><span>■ <span style="color:#ff8a1f">${T('lgN')}</span></span><span style="color:var(--hold)">┆ ${T('lgB')}</span><span>${T('lgI')} · ${T('lgF')}</span>${layers===3?`<span>${T('n3').split(':')[0]}</span>`:''}</div>`;
 const mk=el=>Stage(el.querySelector('.stage'),{onRun:S=>{const v=verdictData(S),vd=el.querySelector('.verdict');vd.className='verdict '+v.c;vd.innerHTML=v.h;el.querySelector('.pl').textContent=paramLine(c,S.P);el.querySelector('.mk').innerHTML=MARK(v.c==='ok',44);const w=whyNG(c,S.P),we=el.querySelector('.why');we.textContent=w;we.hidden=!w;}});
 const cards=[...m.querySelectorAll('.pcard')];
 requestAnimationFrame(()=>{if(tok!==PV.tok)return;
  if(pair){const [a,b]=cards.map(mk);PV.st=[a,b];let left=2;const done=()=>{if(--left>0)return;pvAfter(tok);};a.run(presetP(c,'ok'),true,done);b.run(presetP(c,'ng'),true,done);}
  else{const a=mk(cards[0]);PV.st=[a];const hd=cards[0].querySelector('.chip');
   const seq=()=>{hd.className='chip ng';hd.textContent=T('ng');a.run(presetP(c,'ng'),true,()=>pvLater(tok,1400,()=>{hd.className='chip ok';hd.textContent=T('ok');a.run(presetP(c,'ok'),true,()=>pvAfter(tok,seq));}));};
   PV.seq=seq;seq();}
 });}
function pvAfter(tok,seq){if(tok!==PV.tok)return;
 if(PV.loop)pvLater(tok,1200,()=>{if(pvView==='pair'){const [a,b]=PV.st;let left=2;const done=()=>{if(--left>0)return;pvAfter(tok);};const c=slides()[PV.i].c;a.run(presetP(c,'ok'),true,done);b.run(presetP(c,'ng'),true,done);}else (seq||PV.seq)();});
 else if(PV.auto)pvLater(tok,2500,()=>pvGo(1));}
function pvGo(d){const n=slides().length;PV.i=Math.max(0,Math.min(n-1,PV.i+d));pvShow();}
$('pvauto').addEventListener('click',()=>{PV.auto=!PV.auto;if(PV.auto)PV.loop=false;pvButtons();pvShow();});
$('pvloop').addEventListener('click',()=>{PV.loop=!PV.loop;if(PV.loop)PV.auto=false;pvButtons();pvShow();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;pvView=b.dataset.view;save();pvButtons();if(PV.on)pvShow();});

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-layers],[data-lang]');if(!b)return;if(b.dataset.layers){if(+b.dataset.layers!==layers)setLayers(+b.dataset.layers);}else if(b.dataset.lang!==lang)setLang(b.dataset.lang);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setCase(+b.dataset.i);});
$('ov').addEventListener('click',e=>{const r=e.target.closest('tr');if(r){setCase(C.findIndex(c=>c.id===r.dataset.id));$('tabs').scrollIntoView({behavior:'smooth'});}});
$('bok').addEventListener('click',()=>setMode('ok'));$('bng').addEventListener('click',()=>setMode('ng'));
function classify(){if(cur.lim){mode=okOf(cur.lim,P[cur.lim])?'ok':'ng';modeBtns();}
 for(const k of Object.keys(LIMF)){const e=$('lc-'+k);if(e){const ok=okOf(k,P[k]);e.className='chip '+(ok?'ok':'ng');e.textContent=ok?'OK':'NG';}}diaLine();}
$('ctl').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;P[k]=+e.target.value;derive(P);$('o-'+k).textContent=fmt(k,P[k]);classify();main.stop();run(false);});
$('ctl').addEventListener('change',e=>{if(e.target.dataset.k)run(true);});
$('ctl').addEventListener('click',e=>{if(e.target.closest('[data-edit]')){dlgOpen();return;}
 const b=e.target.closest('[data-p]');if(b){P.ovp=+b.dataset.p;document.querySelectorAll('#ovp button').forEach(x=>x.setAttribute('aria-pressed',x===b));run(true);return;}
 const d=e.target.closest('[data-d]');if(d){P.tipd=+d.dataset.d;derive(P);document.querySelectorAll('#tipd button').forEach(x=>x.setAttribute('aria-pressed',x===d));classify();run(true);}});
$('bp').addEventListener('click',()=>{if(main.playing)main.stop();else run(true);});
$('bs').addEventListener('click',()=>{slow=!slow;$('bs').setAttribute('aria-pressed',slow);});
$('stk')&&$('stk').addEventListener('change',e=>{const t=e.target,i=+t.dataset.i,f=t.dataset.f;if(f==null)return;const pl=STK[layers][i];
 if(f==='t'){let v=+t.value;if(!(v>=0.5&&v<=3)){v=Math.min(3,Math.max(0.5,v||pl.t));t.value=v;}pl.t=v;}else if(f==='s')pl.s=+t.value;else pl.ga=t.checked;
 P.pl=STK[layers].map(x=>({...x}));run(false);});
$('stkr')&&$('stkr').addEventListener('click',()=>{STK[layers]=M.base(layers).pl;stackUI();P.pl=STK[layers].map(x=>({...x}));run(false);});
$('pres').addEventListener('click',pvOpen);$('pvx').addEventListener('click',pvClose);$('pvp').addEventListener('click',()=>pvGo(-1));$('pvnx').addEventListener('click',()=>pvGo(1));$('pvr').addEventListener('click',()=>pvShow());
document.addEventListener('keydown',e=>{const tg=e.target.tagName;
 if(!$('dlg').hidden){if(e.key==='Escape')dlgClose();return;}
 if(['INPUT','SELECT','TEXTAREA'].includes(tg))return;
 if(PV.on){if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();pvGo(1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();pvGo(-1);}else if(e.key==='Escape')pvClose();else if(e.key==='r'||e.key==='R')pvShow();else if(e.key==='a'||e.key==='A')$('pvauto').click();else if(e.key==='l'||e.key==='L')$('pvloop').click();return;}
 if(e.key==='ArrowRight'){setCase((C.indexOf(cur)+1)%C.length);}else if(e.key==='ArrowLeft'){setCase((C.indexOf(cur)+C.length-1)%C.length);}
 else if(e.key===' '&&tg!=='BUTTON'){e.preventDefault();$('bp').click();}else if(e.key==='p'||e.key==='P')pvOpen();});

/* ---------- boot ---------- */
applyStatic();stackUI();
const hid=(location.hash||'').slice(1),hi=C.findIndex(c=>c.id===hid);
setCase(hi>=0?hi:0);
window.__sim={C,main,get P(){return P},setCase,setMode,setLayers,setLang,pvOpen,pvClose,pvGo,PV,get mode(){return mode},get plant(){return plant},plants,onsets,eff,presetP,LIM,finish(){main.stop();},dlgOpen};
}

</script>
</body>
</html>
